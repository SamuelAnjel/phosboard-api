run:
  go: '1.25'

linters:
  enable:
    - errcheck
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  staticcheck:
    checks:
      - all

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unused
    - linters:
        - staticcheck
      text: "SA1019.*pubsub"
    - linters:
        - errcheck
      text: "json\\.Encoder\\.Encode"
    - linters:
        - errcheck
      text: "strconv\\.Atoi"
    - linters:
        - errcheck
      text: "godotenv\\.Load"
    - linters:
        - errcheck
      text: "tx\\.Rollback"
    - linters:
        - errcheck
      text: "\\.Delete"
    - linters:
        - errcheck
      text: "pool\\.\\*pgxpool"